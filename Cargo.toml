[package]
name = "draytek-vpn-cli"
version = "0.0.1"
edition = "2021"
description = "Headless DrayTek SSL VPN client with userspace TCP port forwards"
license = "GPL-3.0-only"

[[bin]]
name = "draytek-vpn-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
bytes = "1.12.2"
cipher = "0.4"
des = "0.8"
digest = "0.10"
md4 = "0.10"
openssl = { version = "0.10.82", features = ["vendored"] }
rand = "0.9"
regex = "1.13.1"
sha1 = "0.10"
smoltcp = { version = "0.14.0", default-features = false, features = ["std", "log", "medium-ip", "proto-ipv4", "socket-tcp"] }
tokio = { version = "1.54.1", features = ["macros", "rt", "signal", "sync", "net", "time", "io-util"] }
tokio-openssl = "0.6.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
